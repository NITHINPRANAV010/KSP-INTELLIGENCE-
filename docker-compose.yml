version: '3.8'

services:
  postgres:
    image: postgres:15-alpine
    container_name: ksp-postgres
    restart: always
    environment:
      POSTGRES_DB: ksp_db
      POSTGRES_USER: ksp_admin
      POSTGRES_PASSWORD: ksp_secure_password_99
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ksp_admin -d ksp_db"]
      interval: 5s
      timeout: 5s
      retries: 5

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: ksp-backend
    restart: always
    environment:
      - DATABASE_URL=postgresql://ksp_admin:ksp_secure_password_99@postgres:5432/ksp_db
      - PROJECT_NAME=KSP AI Crime Intelligence Backend
      - SECRET_KEY=ksp_super_secret_session_token_38327a
      - OPENAI_API_KEY=
      - GEMINI_API_KEY=
    ports:
      - "8000:8000"
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 10s
      timeout: 5s
      retries: 3

  frontend:
    image: nginx:alpine
    container_name: ksp-frontend
    restart: always
    ports:
      - "80:80"
    volumes:
      - .:/usr/share/nginx/html
      - ./nginx.conf:/etc/nginx/nginx.conf:ro
    depends_on:
      - backend

volumes:
  pgdata:
